name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Self-consistency and scorer compatibility
        run: npm run verify

      - name: Invariants across seeds
        run: npm run verify:seeds

      - name: Domain configurations
        run: npm run verify:domains

      - name: Configuration parsing and validation
        run: npm run verify:config

      - name: Generate an environment
        run: OUT_DIR="$RUNNER_TEMP/gen-a" npm run gen

      - name: Check expected artifacts exist
        run: |
          cd "$RUNNER_TEMP/gen-a"
          test -s dataset.json
          test -s gold.json
          test -d documents && [ "$(ls -A documents)" ]
          test -d nx && [ "$(ls -A nx)" ]

      - name: Check the same seed is reproducible
        run: |
          OUT_DIR="$RUNNER_TEMP/gen-b" npm run gen
          diff -r "$RUNNER_TEMP/gen-a" "$RUNNER_TEMP/gen-b"

      - name: Check a different seed produces a different environment
        run: |
          SEED=7 OUT_DIR="$RUNNER_TEMP/gen-seed7" npm run gen
          if diff -rq "$RUNNER_TEMP/gen-a" "$RUNNER_TEMP/gen-seed7" >/dev/null; then
            echo "seed 7 produced identical output to the default seed" >&2
            exit 1
          fi

      # The default configuration must reproduce the published corpus exactly.
      # This is the compatibility guarantee the domain refactor rests on: if it
      # ever fails, the CLI path and the reference path have diverged.
      - name: Check the default config reproduces the reference corpus
        run: |
          npm run generate -- --yes --out "$RUNNER_TEMP/cli-default"
          diff -r "$RUNNER_TEMP/gen-a" "$RUNNER_TEMP/cli-default" \
            --exclude=config.yaml --exclude=generation.json

      - name: Check a named company with a domain subset
        run: |
          npm run generate -- --name "Alpine Drive Systems" \
            --domains erp,cad --seed 42 --size small --out "$RUNNER_TEMP/alpine-a"
          test -s "$RUNNER_TEMP/alpine-a/dataset.json"
          test -s "$RUNNER_TEMP/alpine-a/config.yaml"
          test -s "$RUNNER_TEMP/alpine-a/generation.json"
          # cad pulls in plm; documents were not selected, so there are none.
          test -d "$RUNNER_TEMP/alpine-a/nx"
          test ! -d "$RUNNER_TEMP/alpine-a/documents"

      - name: Check a company rebuilds identically from its own config
        run: |
          npm run generate -- --config "$RUNNER_TEMP/alpine-a/config.yaml" \
            --out "$RUNNER_TEMP/alpine-b"
          diff -r "$RUNNER_TEMP/alpine-a" "$RUNNER_TEMP/alpine-b"

      - name: Check invalid configuration is rejected
        run: |
          if npm run generate -- --domains erp,scada --out "$RUNNER_TEMP/nope"; then
            echo "an unknown domain was accepted" >&2
            exit 1
          fi
