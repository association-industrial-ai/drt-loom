<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Four unrelated business objects share the number 4711: sales order SO-4711, production order PRO-4711, purchase order PUR-4711 and engineering change ECO-4711. They form one causal chain read right to left.">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a8e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="10" fill="#0f0f1a"/>

  <text x="30" y="36" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e0e0e0">One number, four objects, four departments</text>
  <text x="30" y="60" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8a8aae">Nearly identical in embedding space. They also form one causal chain, so disambiguation is a prerequisite for the multi-hop questions.</text>

  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="30" y="92" width="220" height="106" rx="7" fill="#1a1a2e" stroke="#EDC948" stroke-width="1.5"/>
    <text x="46" y="120" font-size="14" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#EDC948">SO-4711</text>
    <text x="46" y="142" font-size="12" fill="#bfbfd4">sales order</text>
    <text x="46" y="164" font-size="12" fill="#8a8aae">Nordhavn Marine A/S</text>
    <text x="46" y="182" font-size="12" fill="#8a8aae">12 units, due 2026-09-12</text>

    <rect x="286" y="92" width="220" height="106" rx="7" fill="#1a1a2e" stroke="#59A14F" stroke-width="1.5"/>
    <text x="302" y="120" font-size="14" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#59A14F">PRO-4711</text>
    <text x="302" y="142" font-size="12" fill="#bfbfd4">production order</text>
    <text x="302" y="164" font-size="12" fill="#8a8aae">the order building them</text>

    <rect x="542" y="92" width="220" height="106" rx="7" fill="#1a1a2e" stroke="#E15759" stroke-width="1.5"/>
    <text x="558" y="120" font-size="14" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#E15759">PUR-4711</text>
    <text x="558" y="142" font-size="12" fill="#bfbfd4">purchase order</text>
    <text x="558" y="164" font-size="12" fill="#8a8aae">the bearing housing</text>
    <text x="558" y="182" font-size="12" fill="#8a8aae">they need</text>

    <rect x="798" y="92" width="172" height="106" rx="7" fill="#1a1a2e" stroke="#B07AA1" stroke-width="1.5"/>
    <text x="814" y="120" font-size="14" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#B07AA1">ECO-4711</text>
    <text x="814" y="142" font-size="12" fill="#bfbfd4">engineering change</text>
    <text x="814" y="164" font-size="12" fill="#8a8aae">the revision affecting</text>
    <text x="814" y="182" font-size="12" fill="#8a8aae">that housing</text>
  </g>

  <g stroke="#6a6a8e" stroke-width="1.6" marker-end="url(#a3)">
    <line x1="282" y1="145" x2="256" y2="145"/>
    <line x1="538" y1="145" x2="512" y2="145"/>
    <line x1="794" y1="145" x2="768" y2="145"/>
  </g>

  <text x="30" y="240" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#bfbfd4">Read right to left: a change to a housing delays a purchase order, which stalls a production order, which misses a customer delivery.</text>
  <text x="30" y="264" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8a8aae">A system that collapses the four into one &#8220;order 4711&#8221; cannot answer any question that depends on the chain.</text>
</svg>
