<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="The DRT Loom pipeline: an integer seed produces enterprise structure, then ERP PLM MES and CAD records, then a document corpus, then a knowledge graph, then benchmark questions and ground truth, then evaluation.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a8e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="10" fill="#0f0f1a"/>

  <text x="30" y="36" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e0e0e0">One seed, one Synthetic Industrial Reasoning Environment</text>

  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <!-- seed -->
    <rect x="30" y="60" width="200" height="42" rx="21" fill="#1a1a2e" stroke="#BAB0AC" stroke-width="1.5"/>
    <text x="130" y="86" font-size="13" fill="#e0e0e0" text-anchor="middle">seed (integer)</text>

    <!-- stages -->
    <rect x="30" y="122" width="200" height="46" rx="7" fill="#1a1a2e" stroke="#4E79A7" stroke-width="1.5"/>
    <text x="46" y="150" font-size="13" fill="#e0e0e0">enterprise structure</text>
    <text x="250" y="150" font-size="12" fill="#8a8aae">products, variants, parts, BOMs, suppliers, customers</text>

    <rect x="30" y="188" width="200" height="46" rx="7" fill="#1a1a2e" stroke="#59A14F" stroke-width="1.5"/>
    <text x="46" y="209" font-size="13" fill="#e0e0e0">ERP / PLM / MES / CAD</text>
    <text x="46" y="226" font-size="13" fill="#e0e0e0">records</text>
    <text x="250" y="209" font-size="12" fill="#8a8aae">orders, revisions, change orders, routings,</text>
    <text x="250" y="226" font-size="12" fill="#8a8aae">inventory, shipments, an NX assembly tree</text>

    <rect x="30" y="254" width="200" height="46" rx="7" fill="#1a1a2e" stroke="#F28E2B" stroke-width="1.5"/>
    <text x="46" y="282" font-size="13" fill="#e0e0e0">document corpus</text>
    <text x="250" y="275" font-size="12" fill="#8a8aae">emails, meeting minutes, change notices, inspection</text>
    <text x="250" y="292" font-size="12" fill="#8a8aae">reports, work instructions, service bulletins</text>

    <rect x="30" y="320" width="200" height="46" rx="7" fill="#1a1a2e" stroke="#B07AA1" stroke-width="1.5"/>
    <text x="46" y="348" font-size="13" fill="#e0e0e0">knowledge graph</text>
    <text x="250" y="348" font-size="12" fill="#8a8aae">typed, directed, provenance-tagged edges</text>

    <rect x="30" y="386" width="200" height="46" rx="7" fill="#1a1a2e" stroke="#EDC948" stroke-width="1.5"/>
    <text x="46" y="407" font-size="13" fill="#e0e0e0">questions</text>
    <text x="46" y="424" font-size="13" fill="#e0e0e0">+ ground truth</text>
    <text x="250" y="407" font-size="12" fill="#8a8aae">6 reasoning categories, instantiated per environment;</text>
    <text x="250" y="424" font-size="12" fill="#8a8aae">expected entity IDs and scalar values</text>
  </g>

  <g stroke="#6a6a8e" stroke-width="1.6" marker-end="url(#a2)">
    <line x1="130" y1="102" x2="130" y2="118"/>
    <line x1="130" y1="168" x2="130" y2="184"/>
    <line x1="130" y1="234" x2="130" y2="250"/>
    <line x1="130" y1="300" x2="130" y2="316"/>
    <line x1="130" y1="366" x2="130" y2="382"/>
  </g>

  <text x="700" y="86" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8a8aae">Each stage consumes the previous one.</text>
  <text x="700" y="104" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8a8aae">Nothing is fetched, sampled or hand-curated,</text>
  <text x="700" y="122" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8a8aae">so the whole chain is a pure function of the seed.</text>
</svg>
